# Netlify build settings for the frontend (the repository root is the Netlify "base"; the app lives in frontend/).
# The SPA rewrite and the security headers (CSP etc.) are written into the build output by frontend/scripts/write-host-config.mjs,
# using VITE_API_BASE_URL, so they always match the API origin you configured.
# Set VITE_API_BASE_URL in the Netlify dashboard (Site configuration > Environment variables). It is a public URL, not a secret.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
